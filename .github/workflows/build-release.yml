name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Restore NuGet packages
      run: nuget restore weixinSendto\packages.config -PackagesDirectory packages
    
    - name: Build Release
      run: msbuild -p:Configuration=Release weixinSendto.slnx
    
    - name: Determine Tag Name
      id: get_tag
      run: |
        if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
          $tag = "v" + (Get-Date -Format "yyyy.MM.dd")
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
        } else {
          echo "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
        }
      shell: pwsh

    - name: Package Release
      run: |
        $zipName = "weixinSendto-${{ steps.get_tag.outputs.tag }}.zip"
        Compress-Archive -Path ./weixinSendto/bin/Release/* -DestinationPath $zipName
        echo "zip_file=$zipName" >> $env:GITHUB_OUTPUT
      id: package
      shell: pwsh

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_tag.outputs.tag }}
        name: Release ${{ steps.get_tag.outputs.tag }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: ${{ steps.package.outputs.zip_file }}